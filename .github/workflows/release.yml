name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CGO_ENABLED: "1"

# go-duckdb needs cgo and cross-compilation was rejected (see
# docs/design/pivotlens-design.md section 10.2), so every platform builds on a
# native runner. goreleaser is not used: merging per-runner builds into one
# release is a Pro feature, `release` has no --single-target, and `build`
# emits bare binaries rather than archives. The publish job below packages
# and checksums them instead.
#
# darwin/amd64 is the one exception to "native": the macos-13 Intel runner is
# effectively unavailable now, so it is cross-built from the arm64 runner with
# clang's own -arch flag, against go-duckdb's prebuilt darwin-amd64 library.
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: arm64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: windows-latest
            goos: windows
            goarch: amd64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ./.github/actions/setup-cgo-toolchain
      - name: Configure the macOS cross compiler
        if: matrix.goos == 'darwin' && matrix.goarch == 'amd64'
        run: echo 'CC=clang -arch x86_64' >> "$GITHUB_ENV"
      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          binary="pivotlens"
          if [ "$GOOS" = "windows" ]; then binary="pivotlens.exe"; fi
          mkdir -p out
          go build -trimpath -ldflags "-s -w -X main.version=${version}" -o "out/${binary}" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bin_${{ matrix.goos }}_${{ matrix.goarch }}
          path: out/*
          retention-days: 1
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: staging
      - name: Package the binaries
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          for dir in staging/bin_*/; do
            platform="$(basename "$dir")"
            platform="${platform#bin_}"
            if [ -f "${dir}pivotlens.exe" ]; then
              (cd "$dir" && zip -q "${GITHUB_WORKSPACE}/dist/pivotlens_${version}_${platform}.zip" pivotlens.exe)
            else
              chmod +x "${dir}pivotlens"
              tar -czf "dist/pivotlens_${version}_${platform}.tar.gz" -C "$dir" pivotlens
            fi
          done
          (cd dist && sha256sum pivotlens_* > checksums.txt)
          ls -l dist
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
